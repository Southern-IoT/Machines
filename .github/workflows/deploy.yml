name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      BUILD_DIR: dist
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TinaCMS build
        run: npx tinacms build --skip-cloud-checks
        env:
          TINA_PUBLIC_CLIENT_ID: ${{ secrets.TINA_PUBLIC_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}

      - name: Run Astro site build
        run: npm run build

      - name: Debug: show build output
        run: |
          echo "Working dir: $(pwd)"
          echo "BUILD_DIR=$BUILD_DIR"
          echo "Contents of repo root:"
          ls -la
          echo "Looking for common build dirs:"
          ls -la "./$BUILD_DIR" || true
          ls -la ./build || true
          ls -la ./public || true
          ls -la ./out || true
          echo "Find index.html:"
          find . -maxdepth 5 -type f -name 'index.html' -print || true
          echo "Disk usage of build dir (if exists):"
          du -sh "./$BUILD_DIR" || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.BUILD_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
